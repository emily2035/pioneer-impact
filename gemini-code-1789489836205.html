<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer Impact Partners</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .container {
            max-width: 640px;
            margin: auto;
            width: 100%;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 1.5rem;
            border-radius: 50%;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.15rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 1.75rem;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .contact-info {
            margin-bottom: 1.75rem;
        }

        .contact-info p {
            color: #cbd5e1;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        a.email-link {
            color: #38bdf8;
            font-size: 1.15rem;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
            word-break: break-word;
        }

        a.email-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .social-links {
            margin-top: 1.75rem;
            padding-top: 1.75rem;
            border-top: 1px solid #334155;
        }

        .btn-linkedin {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #0077b5;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }

        .btn-linkedin:hover {
            background-color: #005885;
        }

        footer {
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <main class="container">
        <div class="card">
            <!-- Place your logo image in the same folder as this HTML file -->
            <img src="logo.png" alt="Pioneer Impact Partners Logo" class="logo">
            
            <h1>Pioneer Impact Partners</h1>
            <p class="tagline">Open Architecture for Impact Finance</p>
            
            <p class="subtitle">Our full website is currently under development. Please check back soon.</p>

            <div class="contact-info">
                <p>Contact Us</p>
                <a href="mailto:info@pioneerimpactpartners.com" class="email-link">info@pioneerimpactpartners.com</a>
            </div>

            <div class="social-links">
                <a href="https://www.linkedin.com/company/pioneerimpactpartners" target="_blank" rel="noopener noreferrer" class="btn-linkedin">
                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                    </svg>
                    Connect on LinkedIn
                </a>
            </div>
        </div>
    </main>

    <footer>
        &copy; <script>document.write(new Date().getFullYear())</script> Pioneer Impact Partners. All rights reserved.
    </footer>

</body>
</html>
